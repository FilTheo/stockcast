<svg xmlns="http://www.w3.org/2000/svg" class="sc-diagram-svg" viewBox="0 0 938 180" width="938" height="180" role="img" aria-label="The daily production loop: today's sales and deliveries update the stock; a fresh forecast and your policy give the orders to send; tomorrow it starts again." font-family="Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The daily production loop: today's sales and deliveries update the stock; a fresh forecast and your policy give the orders to send; tomorrow it starts again.</title>
<style>.sc-bg{fill:#ffffff} .sc-label-bg{fill:#ffffff} .sc-box rect{stroke-width:1.5} .sc-data rect{fill:#f1f0ec;stroke:#898781} .sc-choice rect{fill:#fdeee6;stroke:#eb6834} .sc-engine rect{fill:#e7effb;stroke:#2a78d6} .sc-result rect{fill:#e4f5ee;stroke:#1baf7a} .sc-optional rect{stroke-dasharray:5 4} .sc-title{font-size:15px;font-weight:600;fill:#0b0b0b} .sc-sub{font-size:12.5px;fill:#52514e} .sc-head{font-size:11px;font-weight:700;letter-spacing:.08em} .sc-head.sc-data{fill:#52514e} .sc-head.sc-choice{fill:#c4531f} .sc-head.sc-engine{fill:#1f5fae} .sc-head.sc-result{fill:#12855c} .sc-arrow{fill:none;stroke:#52514e;stroke-width:1.6} .sc-arrowhead{fill:#52514e} .sc-lane{fill:none;stroke:#2a78d6;stroke-width:1;stroke-dasharray:3 4;opacity:.6} .sc-note{font-size:12px;font-style:italic;fill:#52514e}</style>
<rect class="sc-bg" width="938" height="180" rx="12"/>
<text class="sc-head sc-data" x="99.0" y="28" text-anchor="middle">YOUR DATA</text>
<g class="sc-box sc-data"><rect x="20" y="44" width="158" height="70" rx="10"/><text class="sc-title" x="99.0" y="72.5" text-anchor="middle">Today's sales</text><text class="sc-sub" x="99.0" y="94.5" text-anchor="middle">and deliveries</text></g>
<text class="sc-head sc-engine" x="289.0" y="28" text-anchor="middle">STOCKCAST</text>
<g class="sc-box sc-engine"><rect x="210" y="44" width="158" height="70" rx="10"/><text class="sc-title" x="289.0" y="72.5" text-anchor="middle">Update the stock</text><text class="sc-sub" x="289.0" y="94.5" text-anchor="middle">on hand, on order</text></g>
<text class="sc-head sc-data" x="479.0" y="28" text-anchor="middle">YOUR DATA</text>
<g class="sc-box sc-data"><rect x="400" y="44" width="158" height="70" rx="10"/><text class="sc-title" x="479.0" y="72.5" text-anchor="middle">Fresh forecast</text><text class="sc-sub" x="479.0" y="94.5" text-anchor="middle">from any library</text></g>
<text class="sc-head sc-choice" x="669.0" y="28" text-anchor="middle">YOUR CHOICE</text>
<g class="sc-box sc-choice"><rect x="590" y="44" width="158" height="70" rx="10"/><text class="sc-title" x="669.0" y="72.5" text-anchor="middle">Your policy</text><text class="sc-sub" x="669.0" y="94.5" text-anchor="middle">and supplier rules</text></g>
<text class="sc-head sc-result" x="859.0" y="28" text-anchor="middle">YOU GET</text>
<g class="sc-box sc-result"><rect x="780" y="44" width="158" height="70" rx="10"/><text class="sc-title" x="859.0" y="72.5" text-anchor="middle">Orders to send</text><text class="sc-sub" x="859.0" y="94.5" text-anchor="middle">to your suppliers</text></g>
<polyline class="sc-arrow" points="178,79.0 202,79.0"/>
<polygon class="sc-arrowhead" points="210,79.0 202,74.0 202,84.0"/>
<polyline class="sc-arrow" points="368,79.0 392,79.0"/>
<polygon class="sc-arrowhead" points="400,79.0 392,74.0 392,84.0"/>
<polyline class="sc-arrow" points="558,79.0 582,79.0"/>
<polygon class="sc-arrowhead" points="590,79.0 582,74.0 582,84.0"/>
<polyline class="sc-arrow" points="748,79.0 772,79.0"/>
<polygon class="sc-arrowhead" points="780,79.0 772,74.0 772,84.0"/>
<polyline class="sc-arrow" points="859.0,114 859.0,154 99.0,154 99.0,122"/>
<polygon class="sc-arrowhead" points="99.0,114 94.0,122 104.0,122"/>
<rect class="sc-label-bg" x="431.0" y="144" width="96" height="20"/><text class="sc-note" x="479.0" y="158" text-anchor="middle">next day</text>
</svg>
