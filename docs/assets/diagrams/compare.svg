<svg xmlns="http://www.w3.org/2000/svg" class="sc-diagram-svg" viewBox="0 0 860 270" width="860" height="270" role="img" aria-label="Comparing candidates: two candidates run on the same demand and starting stock; the results differ only because of the candidate." font-family="Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Comparing candidates: two candidates run on the same demand and starting stock; the results differ only because of the candidate.</title>
<style>.sc-bg{fill:#ffffff} .sc-label-bg{fill:#ffffff} .sc-box rect{stroke-width:1.5} .sc-data rect{fill:#f1f0ec;stroke:#898781} .sc-choice rect{fill:#fdeee6;stroke:#eb6834} .sc-engine rect{fill:#e7effb;stroke:#2a78d6} .sc-result rect{fill:#e4f5ee;stroke:#1baf7a} .sc-optional rect{stroke-dasharray:5 4} .sc-title{font-size:15px;font-weight:600;fill:#0b0b0b} .sc-sub{font-size:12.5px;fill:#52514e} .sc-head{font-size:11px;font-weight:700;letter-spacing:.08em} .sc-head.sc-data{fill:#52514e} .sc-head.sc-choice{fill:#c4531f} .sc-head.sc-engine{fill:#1f5fae} .sc-head.sc-result{fill:#12855c} .sc-arrow{fill:none;stroke:#52514e;stroke-width:1.6} .sc-arrowhead{fill:#52514e} .sc-lane{fill:none;stroke:#2a78d6;stroke-width:1;stroke-dasharray:3 4;opacity:.6} .sc-note{font-size:12px;font-style:italic;fill:#52514e}</style>
<rect class="sc-bg" width="860" height="270" rx="12"/>
<text class="sc-head sc-choice" x="22" y="28" text-anchor="start">YOUR CANDIDATES</text>
<text class="sc-head sc-engine" x="302" y="28" text-anchor="start">STOCKCAST</text>
<text class="sc-head sc-result" x="622" y="28" text-anchor="start">YOU COMPARE</text>
<g class="sc-box sc-choice"><rect x="20" y="44" width="220" height="64" rx="10"/><text class="sc-title" x="130.0" y="69.5" text-anchor="middle">Candidate A</text><text class="sc-sub" x="130.0" y="91.5" text-anchor="middle">a forecast, policy or rule</text></g>
<g class="sc-box sc-choice"><rect x="20" y="144" width="220" height="64" rx="10"/><text class="sc-title" x="130.0" y="169.5" text-anchor="middle">Candidate B</text><text class="sc-sub" x="130.0" y="191.5" text-anchor="middle">another forecast, policy or rule</text></g>
<g class="sc-box sc-choice sc-optional"><rect x="20" y="222" width="220" height="34" rx="10"/><text class="sc-sub" x="130.0" y="245.0" text-anchor="middle">+ as many as you like</text></g>
<g class="sc-box sc-engine"><rect x="300" y="44" width="260" height="164" rx="10"/><text class="sc-title" x="430.0" y="110.0" text-anchor="middle">Same demand,</text><text class="sc-title" x="430.0" y="129.0" text-anchor="middle">same starting stock</text><text class="sc-sub" x="430.0" y="151.0" text-anchor="middle">each candidate, period by period</text></g>
<g class="sc-box sc-result"><rect x="620" y="44" width="230" height="64" rx="10"/><text class="sc-title" x="735.0" y="69.5" text-anchor="middle">A: 98% served</text><text class="sc-sub" x="735.0" y="91.5" text-anchor="middle">avg. 14 packs on the shelf</text></g>
<g class="sc-box sc-result"><rect x="620" y="144" width="230" height="64" rx="10"/><text class="sc-title" x="735.0" y="169.5" text-anchor="middle">B: 93% served</text><text class="sc-sub" x="735.0" y="191.5" text-anchor="middle">avg. 8 packs on the shelf</text></g>
<polyline class="sc-arrow" points="240,76.0 292,76.0"/>
<polygon class="sc-arrowhead" points="300,76.0 292,71.0 292,81.0"/>
<polyline class="sc-arrow" points="560,76.0 612,76.0"/>
<polygon class="sc-arrowhead" points="620,76.0 612,71.0 612,81.0"/>
<polyline class="sc-arrow" points="240,176.0 292,176.0"/>
<polygon class="sc-arrowhead" points="300,176.0 292,171.0 292,181.0"/>
<polyline class="sc-arrow" points="560,176.0 612,176.0"/>
<polygon class="sc-arrowhead" points="620,176.0 612,171.0 612,181.0"/>
</svg>
