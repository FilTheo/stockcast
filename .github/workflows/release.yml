name: Release checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dependency-floors:
    name: Declared dependency floors (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install . pytest numpy==1.23.0 pandas==1.5.0 matplotlib==3.6.0
      - run: python -m pip check
      - run: python -I -m pytest -p no:cacheprovider -q -o addopts='' tests/unit

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest -p no:cacheprovider -q -o addopts='' tests/unit

  artifacts:
    name: Build and installed-artifact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/release/check_artifacts.py dist
      - name: Install and smoke-test each artifact
        run: |
          for artifact in dist/*; do
            environment="$(mktemp -d)"
            python -m venv "$environment/venv"
            "$environment/venv/bin/python" -m pip install --upgrade pip
            "$environment/venv/bin/python" -m pip install "$GITHUB_WORKSPACE/$artifact"
            "$environment/venv/bin/python" -m pip check
            (
              cd "$environment"
              "$environment/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/release/artifact_smoke.py"
            )
          done
