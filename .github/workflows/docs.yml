name: Documentation

# Pull requests: run every docs example and build the site strictly.
# Pushes to main: the same checks, then publish the site to GitHub Pages
# straight from main (Pages source: "GitHub Actions"; no gh-pages branch).

on:
  pull_request:
    paths:
      - "docs/**"
      - "examples/notebooks/**"
      - "src/stockcast/**"
      - "tests/docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements-docs.txt"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/notebooks/**"
      - "src/stockcast/**"
      - "tests/docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements-docs.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-docs.txt pytest
      - name: Run every code example in the docs
        run: python -m pytest -p no:cacheprovider -q -o addopts='' tests/docs
      - name: Build the site (strict)
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
