name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/stockcast/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements-docs.txt"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/stockcast/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements-docs.txt"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
