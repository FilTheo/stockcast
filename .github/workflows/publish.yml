name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine pytest
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}')
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/release/check_artifacts.py dist
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -I -m pytest -p no:cacheprovider -q -o addopts='' tests/unit
          python -I tests/release/artifact_smoke.py
      - name: Test source distribution installation
        run: |
          artifact_environment="$(mktemp -d)"
          python -m venv "$artifact_environment/venv"
          "$artifact_environment/venv/bin/python" -m pip install dist/*.tar.gz
          "$artifact_environment/venv/bin/python" -m pip check
          "$artifact_environment/venv/bin/python" -I tests/release/artifact_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
