site_name: Stockcast
site_url: https://filtheo.github.io/stockcast/
site_description: DataFrame-first inventory decisions, simulation, and evaluation.
repo_url: https://github.com/FilTheo/stockcast
repo_name: FilTheo/stockcast
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            heading_level: 2
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            show_symbol_type_heading: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - First simulation: tutorials/first-simulation.md
      - Notebook collection: tutorials/notebooks.md
  - Concepts:
      - System model and timing: concepts/system-model.md
      - Engine design and scientific basis: concepts/engine-design.md
      - Decision schedules and migration: concepts/decision-schedules.md
      - Inputs and time: concepts/input-and-time.md
      - Forecast targets: concepts/forecast-targets.md
      - Events, results, and evaluation: concepts/events-and-evaluation.md
  - Guides:
      - Forecast integration with smooth: guides/forecast-integration.md
      - Compare scenarios fairly: guides/compare-scenarios.md
      - Custom policies and target providers: guides/custom-policies.md
      - Constraints, shelf life, and callbacks: guides/extensions.md
      - Physical processes: guides/physical-processes.md
      - Open orders and suppliers: guides/suppliers-and-open-orders.md
      - Production integration patterns: guides/production-integration.md
  - Reference:
      - API overview: reference/index.md
      - Core: reference/core.md
      - Policies: reference/policies.md
      - Evaluation and metrics: reference/evaluation.md
      - Utilities: reference/utils.md
      - Visualization: reference/visualization.md
      - Data and output schemas: reference/schemas.md
  - Project:
      - Release notes: release-notes.md
      - Contributing: contributing.md
      - Citation and support: support.md
